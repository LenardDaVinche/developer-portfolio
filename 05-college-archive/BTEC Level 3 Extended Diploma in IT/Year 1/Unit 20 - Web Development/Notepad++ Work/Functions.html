<!DOCTYPE html>
<html>
<head>
	<title>JavaScript is cool!</title>
	<meta charset="UTF-8">
	<script>
		function addStyle(){
			document.getElementById('y').style.color='red';
			document.getElementById('y').style.fontSize='25px';
			document.getElementById('y').style.backgroundColor='skyblue';
		}
	</script>
</head>
<body>
	<p id="y">Click the button below!</p>
	<button type="button" onclick="addStyle()">Change Me!</button>
</body>
</html>
