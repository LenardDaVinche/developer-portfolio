<!DOCTYPE html>
<html>
<head>
	<title>HTML5 Table</title>
	<meta charset="UTF-8">
		<style>
		thead{
				display:block;
				text-align: left;
				border:1px solid Crimson;
				color:white;
				background-color:DarkCyan;
		}
		th, td{
				width:120px
			}
			tbody{
				Height:70px;
				width:380px;
				overflow-y:auto;
				overflow-x:hidden;
				display:block;
				border:1px solid DarkCyan;
			}
			tfoot{
				text-align:center;
				color:white;
				background-color:DarkCyan;
			}
		</style>
</head>
<body>
	<table border="1">
		<thead>
			<tr>
				<th>Head 1 </th><th>Head 2</th><th>Head 3</th>
			</tr>
		</thead>
		<tfoot>
			<tr>
				<td>The Footer</td>
			</tr>
		</tfoot>
		<tbody>
			<tr>
				<td>Content 1</td><td>Content 2</td><td>Content 3</td>
			</tr>
			<tr>
				<td>Content 1</td><td>Content 2</td><td>Content 3</td>
			</tr>
			<tr>
				<td>Content 1</td><td>Content 2</td><td>content 3</td>
			</tr>
			<tr>
				<td>Content 1</td><td>Content 2</td><td>content 3</td>
			</tr>
			<tr>
				<td>Content 1</td><td>Content 2</td><td>content 3</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
