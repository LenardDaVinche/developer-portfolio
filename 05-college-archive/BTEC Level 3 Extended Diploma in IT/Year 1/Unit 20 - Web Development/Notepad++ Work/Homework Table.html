<!DOCTYPE html>
<html>
<head>
	<title>Homework Table</title>
	<meta charset="UTF-8">
		<style>
		table{font-family: sans-serif;
		}
		thead{
				display:table;
				text-align: left;
				color:white;
				background-color:#2874A6;
			}
		th, td{
				width:150px
			}
		tr:nth-child(odd) {background-color: #EAF2F8}
		tr:nth-child(even) {background-color: #F8F9F9}
				
		tbody{
				Height:70px;
				width:800px;
				overflow-y:auto;
				overflow-x:auto;
				display:table;
				border:1px white;
			}
		tfoot{
				text-align:left;
				color:white;
				background-color:#2874A6;
			}
		</style>
</head>
<body>
	<table>
		<thead>
			<tr style="background-color:#2874A6">
				<th>Name</th><th>Age</th><th>Location</th><th>Email</th><th>Budget</th>
			</tr>
		</thead>
		<tfoot>
			<tr style="background-color:#2874A6">
				<td>Current Accounts held with company.</td>
			</tr>
		</tfoot>
		<tbody>
			<tr>
				<td style="background-color:#2874A6">Bob</td><td>34</td><td>UK</td><td>bob@bob.com</td><td>£500</td>
			</tr>
			<tr>
				<td style="background-color:#2874A6">Steve</td><td>98</td><td>France</td><td>LeSteve@bonjour.com</td><td>£1300</td>
			</tr>
			<tr>
				<td style="background-color:#2874A6">Ron</td><td>65</td><td>Brazil</td><td>BrazilRon@RonRon.com</td><td>£350</td>
			</tr>
			<tr>
				<td style="background-color:#2874A6">Ben</td><td>14</td><td>Germany</td><td>BenJ@audi.com</td><td>£28000</td>
			</tr>
			<tr>
				<td style="background-color:#2874A6">Guy</td><td>44</td><td>UK</td><td>justaguy@meatdrapes.com</td><td>£450</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
