<!DOCTYPE html>
<html>
<head>
	<title>Primier League Table</title>
	<meta charset="UTF-8">
		<style>
		thead{
				display:block;
				text-align: left;
				border:1px solid Crimson;
				color:white;
				background-color:DarkCyan;
		}
		th, td{
				width:120px
			}
			tbody{
				Height:70px;
				width:380px;
				overflow-y:auto;
				overflow-x:hidden;
				display:block;
				border:1px solid DarkCyan;
			}
			tfoot{
				text-align:center;
				color:white;
				background-color:DarkCyan;
			}
		</style>
</head>
<body>
	<table border="1">
		<thead>
			<tr>
				<th>Position</th><th>Team</th><th>Pts</th>
			</tr>
		</thead>
		<tfoot>
			<tr>
				<td>Please note: All times UK.</td>
			</tr>
		</tfoot>
		<tbody>
			<tr>
				<td>1</td><td>Man City</td><td>15</td>
			</tr>
			<tr>
				<td>2</td><td>Everton</td><td>13</td>
			</tr>
			<tr>
				<td>3</td><td>Tottenham</td><td>11</td>
			</tr>
			<tr>
				<td>4</td><td>Arsenal</td><td>10</td>
			</tr>
			<tr>
				<td>5</td><td>Chelsea</td><td>10</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
